<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div class="popup-header">
      <span class="popup-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" class="popup-logo-icon">
          <path d="M0 0h24v24H0z" fill="none"/>
          <path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" d="M3 12c6.268 0 9-2.637 9-9c0 6.363 2.713 9 9 9c-6.287 0-9 2.713-9 9c0-6.287-2.732-9-9-9Z"/>
        </svg>
        Kira
      </span>
      <span id="tier-badge" class="badge badge-pro">Free</span>
    </div>

    <!-- Usage -->
    <div class="usage-bar">
      <div class="usage-text">
        <span>Today:</span>
        <span id="usage-count" class="usage-numbers">0 / 10</span>
        <span class="usage-label">enhancements</span>
      </div>
      <div class="usage-progress">
        <div id="usage-fill" class="usage-fill" style="width: 0%"></div>
      </div>
    </div>

    <hr class="divider">

    <!-- Platform -->
    <div class="field">
      <label class="field-label">Platform</label>
      <div id="platform-display" class="platform-chip">
        <span id="platform-name">Detecting...</span>
      </div>
    </div>

    <!-- Tone selector -->
    <div class="field">
      <label class="field-label" for="tone-select">Tone</label>
      <select id="tone-select" class="select-input">
        <option value="casual">Casual</option>
        <option value="professional">Professional</option>
        <option value="engaging">Engaging</option>
      </select>
    </div>

    <hr class="divider">

    <!-- Paste to enhance -->
    <div class="field">
      <label class="field-label">Paste text to enhance</label>
      <textarea
        id="paste-input"
        class="textarea-input"
        placeholder="Paste your text here, then click enhance..."
        rows="4"
      ></textarea>
      <button id="paste-enhance-btn" class="btn btn-primary btn-full" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:4px"><path d="M0 0h24v24H0z" fill="none"/><path fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5" d="M3 12c6.268 0 9-2.637 9-9c0 6.363 2.713 9 9 9c-6.287 0-9 2.713-9 9c0-6.287-2.732-9-9-9Z"/></svg>
        Enhance Pasted Text
      </button>
    </div>

    <hr class="divider">

    <!-- API Key status -->
    <div id="connection-status" class="connection-status" style="display: none;">
      <span id="connection-dot" class="connection-dot"></span>
      <span id="connection-text" class="connection-text">Not connected</span>
    </div>
    <button id="connect-btn" class="btn btn-primary btn-full" style="display: none;">
      Connect to Kira
    </button>

    <!-- Actions -->
    <div class="actions">
      <button id="options-btn" class="btn btn-tertiary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </button>
      <a id="dashboard-link" href="http://localhost:5173" target="_blank" class="btn btn-secondary" style="display: none;">
        Open Dashboard
      </a>
      <a id="upgrade-link" href="https://content-enhancer.dev/upgrade" target="_blank" class="btn btn-primary btn-full upgrade-btn" style="display: none;">
        Upgrade to Pro — $4.99/mo
      </a>
    </div>

    <!-- Status message -->
    <div id="status" class="status-message" style="display: none;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
